<style>
:root{--bg:#F4F1FF;--cd:#fff;--tx:#1F2547;--mu:#6B7194;--pr:#3D6BFF;--pd:#2A52D6;--lv:#E9E3FF;--ok:#27B36F;--bd:#F2545B;--ln:#DDD6F5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14162B;--cd:#1F2240;--tx:#F1F2FF;--mu:#9EA3C9;--pr:#5B7FFF;--pd:#3F62E0;--lv:#2C2F5C;--ln:#363A6C}}
:root[data-theme="dark"]{--bg:#14162B;--cd:#1F2240;--tx:#F1F2FF;--mu:#9EA3C9;--pr:#5B7FFF;--pd:#3F62E0;--lv:#2C2F5C;--ln:#363A6C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font-family:inherit}
.app{max-width:520px;margin:0 auto;padding:18px 16px 110px}
.pg,.pop{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
h1{font-size:26px;margin:0 0 14px}h2{font-size:18px;margin:18px 0 10px}p{margin:8px 0}
.hz{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.mu{color:var(--mu)}.sm{font-size:13px;margin-top:8px}
.cd{background:var(--cd);border:2px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:16px;background:var(--pr);color:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--pd);cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pd)}
.btn:disabled{opacity:.5;box-shadow:none}
.btn.s{background:var(--lv);color:var(--pr);box-shadow:0 4px 0 var(--ln)}
.btn.g{background:var(--ok);box-shadow:0 4px 0 #1D8A54}
.btn.r{background:var(--bd);box-shadow:0 4px 0 #B83B41}
.row{display:flex;gap:10px}.row>*{flex:1}
.bar{height:12px;background:var(--lv);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),#9B7BFF);border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hero{background:linear-gradient(135deg,var(--pr),#8B6CFF);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px}
.hero h1{margin:4px 0 14px;color:#fff}
.hero .bar{background:rgba(255,255,255,.3)}.hero .bar i{background:#fff}
.gl{display:flex;justify-content:space-between;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--cd);border:2px solid var(--ln);border-radius:18px;padding:12px 6px;text-align:center}

.les{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--tx);cursor:pointer;transition:transform .15s}
.les:active{transform:scale(.98)}.les>div{flex:1}.em{font-size:32px}
.les .bar{margin-top:8px;height:8px}
.bk{border:0;background:none;color:var(--pr);font-size:16px;font-weight:700;padding:8px 0;cursor:pointer}
.sp{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--lv);font-size:20px;cursor:pointer;transition:transform .1s}
.sp:active{transform:scale(.9)}.bigsp{width:96px;height:96px;font-size:44px}
.w{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--ln);cursor:pointer}
.w:last-child{border:0}.w .z{font-size:28px;min-width:64px}.w>div{flex:1}
.ex{display:flex;align-items:center;gap:12px}.ex>div{flex:1}.big{font-size:24px}
.pin{color:var(--pr);font-weight:700;font-size:20px;margin:4px 0 12px}
.pin2{color:var(--pr)}
.huge{font-size:72px;line-height:1.1;margin-bottom:6px}
.tr{font-size:24px;font-weight:700;margin:14px 0}
.fc{text-align:center;padding:24px 16px;min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.fc .btn{margin-top:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;min-width:48px;min-height:44px;border:2px solid var(--ln);border-radius:14px;background:var(--cd);font-size:20px;cursor:pointer;color:var(--tx);transition:background .2s}
.chip.on{background:var(--lv);border-color:var(--pr)}
.o{display:block;width:100%;min-height:56px;margin-bottom:10px;border:2px solid var(--ln);border-radius:16px;background:var(--cd);color:var(--tx);font-size:18px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s}
.o:active{transform:scale(.98)}
.o.ok{border-color:var(--ok);background:rgba(39,179,111,.18)}
.o.no{border-color:var(--bd);background:rgba(242,84,91,.18);animation:sh .3s}
.ch{min-width:48px;min-height:52px;padding:6px 12px;margin:4px;border:2px solid var(--ln);border-radius:14px;background:var(--cd);color:var(--tx);font-size:26px;cursor:pointer}
.ans{min-height:70px;border-bottom:3px solid var(--ln);margin:6px 0 14px}.bank{margin-bottom:12px}
.fb{padding:12px 14px;border-radius:14px;margin:12px 0;font-weight:700;animation:in .3s}
.fb.ok{background:rgba(39,179,111,.18)}.fb.no{background:rgba(242,84,91,.18)}
.in{width:100%;min-height:52px;border:2px solid var(--ln);border-radius:14px;padding:0 14px;font-size:17px;background:var(--cd);color:var(--tx);margin:6px 0 12px}
.warn{background:#FFF4D6;color:#6B4A00;border-color:#F3D27A}
.prow{display:flex;justify-content:space-between;margin:12px 0 6px}
nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--cd);border-top:2px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:10px;font-weight:600;padding:4px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;cursor:pointer;transition:background .2s,color .2s}
nav button span{font-size:22px;transition:transform .2s}
nav button.on{color:var(--pr);background:var(--lv)}nav button.on span{transform:scale(1.15)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:90%;background:#1F2547;color:#fff;padding:12px 16px;border-radius:14px;z-index:9;animation:in .3s}
.en .huge{font-size:44px;overflow-wrap:anywhere}.en .w .z{font-size:20px;font-weight:700;min-width:92px;max-width:38%;overflow-wrap:anywhere}.en .ch{font-size:18px;min-width:40px}
.lk{opacity:.55}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
